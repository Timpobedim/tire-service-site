<!doctype html>
<html lang="ru" data-theme="classic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — шиномонтаж «Колесо»</title>
  <meta name="robots" content="noindex">
  <!-- GitHub Pages отдаёт эту страницу по любому неверному адресу, поэтому стили
       встроены: относительная ссылка на css/style.css из /a/b/ не сработает. -->
  <style>
    :root { --bg: #f6f4ef; --text: #1f2328; --muted: #5c6370; --accent: #1f6f5c; --accent-text: #fff;
            --radius: 12px; --heading: Georgia, "Times New Roman", serif; }
    [data-theme="bold"] { --bg: #111318; --text: #f2f3f5; --muted: #a7adb8; --accent: #ffcc00;
                          --accent-text: #111318; --radius: 4px; --heading: "Segoe UI", Roboto, Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--text); text-align: center;
           font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    h1 { font-family: var(--heading); font-size: clamp(28px, 6vw, 44px); margin: 16px 0 8px; }
    p { color: var(--muted); max-width: 32em; margin: 0 auto 24px; line-height: 1.5; }
    svg { width: 96px; height: 96px; fill: none; stroke: var(--accent); stroke-width: 2.5; }
    .btn { display: inline-block; padding: 12px 22px; border-radius: var(--radius); text-decoration: none;
           background: var(--accent); color: var(--accent-text); font-weight: 600; }
    .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  </style>
  <script>
    // Та же тема, что выбрана на главной.
    try {
      const theme = localStorage.getItem("koleso-theme");
      if (theme === "bold" || theme === "classic") document.documentElement.dataset.theme = theme;
    } catch { /* приватный режим — тема по умолчанию */ }
  </script>
</head>
<body>
  <main>
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14"/><circle cx="16" cy="16" r="6"/></svg>
    <h1>Такой страницы нет</h1>
    <p>Похоже, колесо укатилось не туда. Цены, калькулятор и онлайн-запись — на главной.</p>
    <a class="btn" href="./" data-home>На главную</a>
  </main>
  <script>
    // На GitHub Pages сайт живёт в /tire-service-site/, локально — в корне.
    const first = location.pathname.split("/")[1];
    const home = location.hostname.endsWith("github.io") && first ? `/${first}/` : "/";
    document.querySelector("[data-home]").setAttribute("href", home);
  </script>
</body>
</html>
